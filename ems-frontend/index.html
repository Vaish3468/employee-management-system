<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management | CuteHR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark topbar">
    <div class="container-fluid">
        <span class="navbar-brand">CuteHR</span>
        <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h4>Employees</h4>
        <button id="addBtn" class="btn btn-primary" onclick="openAdd()">Add Employee</button>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Department</th><th>Email</th><th>Phone</th><th>Hire Date</th><th>Actions</th>
        </tr>
        </thead>
        <tbody id="employeeTable"></tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="empModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 id="modalTitle">Add Employee</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="empId">
                <input id="name" class="form-control mb-2" placeholder="Name">
                <input id="department" class="form-control mb-2" placeholder="Department">
                <input id="email" class="form-control mb-2" placeholder="Email">
                <input id="phone" class="form-control mb-2" placeholder="Phone">
                <input id="hireDate" type="date" class="form-control">
            </div>

            <div class="modal-footer">
                <button class="btn btn-success" onclick="saveEmployee()">Save</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
